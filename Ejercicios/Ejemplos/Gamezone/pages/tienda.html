<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página web sobre videojuegos">
    <link rel="stylesheet" href="estilos.css">
    <title>GameZone - Tu portal de videjuegos</title>
</head>
<body>
    <header class="cabecera">
        <div class="marca">
            <img src="../Imagenes/imagenes/gamezone-logo.png" alt="Logotipo GameZone" class="logo">
            <!-- <h1 class="titulo">GameZone</h1> -->
        </div>
        
        <!-- Menú de navegación -->
        <nav class="navegacion">
            <ul class="menu">
                <li><a href="indext.html">Inicio</a></li>
                <li><a href="#">Noticias</a></li>
                <li><a href="#">Guías</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>


    <main id="contenido-principal">

        <section class="tarjeta tienda">
            <!-- Contenedor de cards de producto -->
            <div class="lista-cards lista-cards--flex">

                <!-- Primer producto -->
                <article class="card">
                    <!-- Imagen -->
                    <img src="../Imagenes/imagenes/mouse.png" alt="Raton gaming RGB" class="card-imagen">
                    

                    <!-- Titulo del porducto -->
                    <h3 class="card-titulo">Ratón Gaming RGB</h3>

                    <!-- Descripcion del producto -->
                    <p class="card-descripcion">
                        Raton ergonomico con 6 botones y sensor de alta precision
                    </p>

                    <!-- Precio del producto -->
                    <p class="card-precio">19.99$</p>

                    <!-- Boton (solo decorativo, sin funcionalidad JavaScript) -->
                    <a href="#" class="card-botton">Añadir al carrito</a>
                </article>
            </div>
        </section>
        
        <!-- SECCION DE PRACTICA GRID -->
        <section class="tarjeta practica-grid">
            <h2> Ejemplo de cuadricula con Grid</h2>

            <!-- Contenedor grid  -->
            <div classs="grid-container">
                <div class="item-grid">1</div>
                <div class="item-grid">2</div>
                <div class="item-grid">3</div>
                <div class="item-grid">4</div>
                <div class="item-grid">5</div>
                <div class="item-grid">6</div>
            </div>
        </section>
    </main>

    <footer class="pie">
        <p>&copy; 2024 GameZone. Todos los derechos reservados.</p>

    </footer>
